name: Bug report
description: Report a reproducible application problem
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: MacroPad Studio version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device VID:PID and layout
      description: Use "demo mode" when no device is involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed private configuration data and credentials.
          required: true
        - label: This report does not contain an undisclosed security vulnerability.
          required: true
